<!DOCTYPE html>
<html>
<head>
  <title>Signup</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #f2f2f2;
      text-align: center;
    }

    .top {
      background: red;
      height: 50px;
    }

    .logo {
      margin-top: 20px;
    }

    .logo img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 50%;
    }

    h1 {
      color: red;
    }

    .box {
      background: white;
      margin: 20px;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    input {
      width: 90%;
      padding: 15px;
      margin: 10px 0;
      border-radius: 30px;
      border: none;
      background: #f2f2f2;
      font-size: 16px;
      box-sizing: border-box;
    }

    .register-btn {
      width: 90%;
      padding: 15px;
      background: #2d8cff;
      color: white;
      border: none;
      border-radius: 30px;
      font-size: 18px;
      margin-top: 10px;
      cursor: pointer;
    }

    .back {
      margin-top: 15px;
      color: red;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="top"></div>

<div class="logo">
  <img src="https://i.ibb.co/6bQGZpG/gold-logo.png">
</div>

<h1>Signup</h1>

<div class="box">

  <input
    id="name"
    type="text"
    placeholder="Full Name"
  >

  <input
    id="mobile"
    type="text"
    placeholder="Mobile Number"
  >

  <input
    id="password"
    type="password"
    placeholder="Password"
  >

  <input
    id="ref_code"
    type="text"
    placeholder="Referral Code (Optional)"
  >

  <button class="register-btn" onclick="signup()">
    REGISTER NOW
  </button>

  <p class="back" onclick="goLogin()">
    Back to Login
  </p>

</div>

<script>

// ================================
// SUPABASE
// ================================

const SUPABASE_URL =
"https://katbdbzoufiblnnsoxkk.supabase.co";

const SUPABASE_KEY =
"sb_publishable_--fdpQMmSlUyt2ywjUErgQ_LXGvQH-a";

const client = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


// ================================
// GET REFERRAL CODE FROM URL
// Example:
// signup.html?ref=AJAY1234
// ================================

const urlParams = new URLSearchParams(
  window.location.search
);

const referralFromURL =
  urlParams.get("ref");


// ================================
// AUTO FILL REFERRAL CODE
// ================================

if (referralFromURL) {

  document.getElementById("ref_code").value =
    referralFromURL.trim();

}


// ================================
// GENERATE UNIQUE REFER CODE
// ================================

function generateReferCode() {

  const chars =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

  let code = "";

  for (let i = 0; i < 8; i++) {

    const randomIndex =
      Math.floor(Math.random() * chars.length);

    code += chars[randomIndex];
  }

  return code;
}


// ================================
// CHECK REFER CODE
// ================================

async function checkReferCode(code) {

  if (!code) {
    return true;
  }

  const { data, error } = await client
    .from("login")
    .select("id")
    .eq("refer_code", code)
    .maybeSingle();

  if (error) {

    console.log(
      "REFER CODE CHECK ERROR:",
      error
    );

    return false;
  }

  return !!data;
}


// ================================
// CREATE UNIQUE REFER CODE
// ================================

async function createUniqueReferCode() {

  let referCode = "";

  let exists = true;

  while (exists) {

    referCode =
      generateReferCode();

    const { data, error } =
      await client
        .from("login")
        .select("id")
        .eq("refer_code", referCode)
        .maybeSingle();

    if (error) {

      console.log(
        "REFER CODE GENERATE ERROR:",
        error
      );

      throw error;
    }

    exists = !!data;
  }

  return referCode;
}


// ================================
// SIGNUP
// ================================

async function signup() {

  let name =
    document.getElementById("name")
      .value.trim();

  let mobile =
    document.getElementById("mobile")
      .value.trim();

  let password =
    document.getElementById("password")
      .value;

  let ref_code =
    document.getElementById("ref_code")
      .value.trim()
      .toUpperCase();


  // ================================
  // VALIDATION
  // ================================

  if (!name || !mobile || !password) {

    alert(
      "Name, Mobile aur Password fill karo"
    );

    return;
  }


  // ================================
  // CHECK REFERRAL CODE
  // ================================

  if (ref_code) {

    const validRefer =
      await checkReferCode(ref_code);

    if (!validRefer) {

      alert(
        "Invalid Referral Code ❌"
      );

      return;
    }
  }


  // ================================
  // CREATE NEW USER REFER CODE
  // ================================

  let myReferCode;

  try {

    myReferCode =
      await createUniqueReferCode();

  } catch (error) {

    console.log(
      "CREATE REFER CODE ERROR:",
      error
    );

    alert(
      "Referral code create nahi ho saka ❌"
    );

    return;
  }


  // ================================
  // INSERT INTO SUPABASE
  // ================================

  let { data, error } = await client
    .from("login")
    .insert([
      {
        name: name,
        mobile: mobile,
        password: password,
        balance: 0,

        // New user's own referral code
        refer_code: myReferCode,

        // Referrer ka referral code
        ref_by: ref_code || null
      }
    ])
    .select();


  // ================================
  // ERROR
  // ================================

  if (error) {

    console.log(
      "SIGNUP ERROR:",
      error
    );

    alert(
      "Error: " + error.message
    );

    return;
  }


  // ================================
  // SUCCESS
  // ================================

  alert(
    "Signup Success ✅\n\n" +
    "Your Referral Code: " +
    myReferCode
  );

  window.location.href =
    "index.html";
}


// ================================
// BACK TO LOGIN
// ================================

function goLogin() {

  window.location.href =
    "index.html";

}

</script>

</body>
</html>
