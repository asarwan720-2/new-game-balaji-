  onclick="shareReferral()"
  style="
    width:80%;
    padding:15px;
    background:#25D366;
    color:white;
    border:none;
    border-radius:30px;
    font-size:18px;
    cursor:pointer;
  "
>
  SHARE & EARN
</button>

<script>

// ================================
// SUPABASE
// ================================

const SUPABASE_URL =
"https://katbdbzoufiblnnsoxkk.supabase.co";

const SUPABASE_KEY =
"sb_publishable_--fdpQMmSlUyt2ywjUErgQ_LXGvQH-a";

const client =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


// ================================
// SHARE REFERRAL
// ================================

async function shareReferral() {

  try {

    // ==============================
    // GET LOGIN USER
    // ==============================

    const savedUser =
      localStorage.getItem("user");

    if (!savedUser) {

      alert(
        "Please login first ❌"
      );

      return;
    }

    const user =
      JSON.parse(savedUser);


    // ==============================
    // GET REFER CODE
    // ==============================

    const { data, error } =
      await client
        .from("login")
        .select("refer_code")
        .eq("id", user.id)
        .single();


    if (error || !data) {

      console.log(
        "REFER CODE ERROR:",
        error
      );

      alert(
        "Referral code nahi mila ❌"
      );

      return;
    }


    const referCode =
      data.refer_code;


    // ==============================
    // CREATE REFERRAL LINK
    // ==============================

    const referralLink =
      window.location.origin +
      "/signup.html?ref=" +
      encodeURIComponent(referCode);


    // ==============================
    // SHARE MESSAGE
    // ==============================

    const shareText =
      "🎁 Refer & Earn\n\n" +
      "Mere referral link se signup karein.\n\n" +
      "Referral Code: " +
      referCode +
      "\n\n" +
      "Share karne par ₹10 ka bonus prapt kare.\n\n" +
      "Join Now 👇\n" +
      referralLink;


    // ==============================
    // MOBILE / ANDROID SHARE
    // ==============================

    if (navigator.share) {

      await navigator.share({

        title: "Refer & Earn",

        text: shareText,

        url: referralLink

      });

    } else {

      // ==============================
      // COPY
      // ==============================

      await navigator.clipboard.writeText(
        shareText
      );

      alert(
        "Referral message copy ho gaya ✅\n\n" +
        "Ab WhatsApp ya kisi bhi app par share karein."
      );
    }

  } catch (error) {

    console.log(
      "SHARE ERROR:",
      error
    );
  }
}

</script>
```
